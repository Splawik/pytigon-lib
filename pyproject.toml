[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pytigon-lib"
version = "0.261004"
description = "Pytigon library — Python/Django application framework with multi-format rendering and indentation-based HTML preprocessor"
authors = [{name = "Slawomir Cholaj", email = "slawomir.cholaj@gmail.com"}]
license = "LGPL-2.1-or-later"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Internet :: WWW/HTTP :: WSGI :: Application",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "Django>=6.0",
    "django-environ>=0.10",
    "rules>=3.5",
    "lxml>=4.6",
    "fsspec>=2024.0",
    "httpx>=0.20",
    "cryptography>=3.4",
    "fpdf2>=2.5",
    "Pillow>=9.0",
    "python-docx>=0.8",
    "htmldocx",
    "xlsxwriter>=3.0",
    "openpyxl>=3.0",
    "markdown>=3.3",
    "pyquery>=1.4",
    "python-dateutil>=2.8",
    "autobahn>=22.0",
    "pyexcel>=0.7", 
    "pyexcel-xlsx>=0.6", 
    "pyexcel-ods3>=0.6",
    "llvmlite>=0.40",
    "plotly>=5.0", 
    "numpy>=1.20",
    "pscript>=0.7",
    "svglib>=1.1",
]

[project.optional-dependencies]
dev = ["ruff>=0.3", "pytest>=7.0", "pytest-django>=4.5", "pytest-cov>=4.0", "pytest-timeout>=2.0", "pre-commit>=3.0", "mypy>=1.0"]
# Integration tests that exercise pytigon-lib together with the pytigon
# application project. Install and run with:
#   pip install -e ".[test-full]"
#   PYTIGON_TEST_FULL=1 pytest tests/
test-full = ["pytigon>=0.261002", "pytigon-standard-prj>=0.261002"]

[project.urls]
Documentation = "https://pytigon.github.io/pytigon-lib"
Repository = "https://github.com/Splawik/pytigon-lib"

[tool.setuptools.packages.find]
where = ["."]
include = ["pytigon_lib*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
pytigon_lib = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "SIM", "RUF"]
ignore = [
    "SIM102", "SIM105", "SIM108", "SIM115",
    "SIM116", "SIM117", "SIM118",
    "RUF002", "RUF003", "RUF005", "RUF012", "RUF059",
]

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"tests/schindent/assets/*.py" = ["F821"]
"tests/schindent/test2.py" = ["F821"]
"tests/schindent/test.py" = ["E402"]
"tests/schhttptools/test2.py" = ["E501"]
"tests/schtools/wiki_test.py" = ["E501"]
"pytigon_lib/schhtml/html_tags.py" = ["F403"]
"pytigon_lib/schfs/__init__.py" = ["F401"]
"pytigon_lib/schparser/parser.py" = ["UP045"]
# Re-export module: the imports exist to make names importable from here.
"pytigon_lib/schviews/__init__.py" = ["F401"]
# Tests import names to assert they resolve; a subset of each import is
# exercised, so the rest are intentionally unasserted.
"tests/**/*.py" = ["F401", "F403", "F405", "F811", "E402", "E501", "E731", "F841", "E712", "E741", "RUF015"]
# android_client is imported for its jnius side effects before the app
# module is loaded, so its imports cannot all be at the top.
"pytigon_lib/schandroid/android_client.py" = ["E402", "SIM109"]
"pytigon_lib/schtools/nim_integration.py" = ["E402"]
# Both files place imports after a module-level constant/list, on purpose:
# basehtmltags.py builds the tag-name list first, django_storage.py avoids
# importing Django exceptions before the storage module is configured.
"pytigon_lib/schhtml/basehtmltags.py" = ["E402"]
"pytigon_lib/schdjangoext/django_storage.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_return_any = false
warn_unused_ignores = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
timeout = 300
norecursedirs = [".kilo", "tests/schindent/assets", "build", "dist", "__pycache__"]
filterwarnings = ["ignore::DeprecationWarning"]
addopts = [
    "--ignore-glob=**/android_client.py",
]
markers = [
    "django: integration test that needs the full Pytigon stack; collected only with PYTIGON_TEST_FULL=1",
    "golden: visual/golden-file comparison; runs only with PYTIGON_GOLDEN_TESTS=1 because it depends on the local LibreOffice and font toolchain",
]

[tool.coverage.run]
source = ["pytigon_lib"]

[tool.coverage.report]
# Measured ~48% for the standalone suite. Raise as coverage grows; this floor
# only prevents silent regressions.
fail_under = 45
